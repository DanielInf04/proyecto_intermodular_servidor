spring.application.name=musiclab
spring.datasource.url=jdbc:mysql://localhost:3306/db_musiclab?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
springdoc.swagger-ui.path=/swagger

# Permitir conexi\u00f3n desde cualquier dispositivo de la red
#server.address=0.0.0.0
#server.port=8080

# a\u00f1adido al instalar spring-boot-starter-security
spring.main.allow-bean-definition-overriding=true
# prueba de definir usuario (no funciona si definimos usuarios en WebSecurityConfig)
spring.security.user.name=test
spring.security.user.password=1234
# para que me cree las tablas cada vez que arranco la API
spring.jpa.hibernate.ddl-auto=create

